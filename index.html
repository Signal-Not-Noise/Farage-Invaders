<body>
  <div class="header">
    <div class="title">FARAGE INVADERS</div>
    <div class="subtitle">CLASSIC ARCADE • 1978 EDITION</div>
  </div>
  
  <div id="game-container">
    <canvas id="game" width="800" height="600"></canvas>
  </div>
  
  <div class="footer">
    <div>ARROWS / A D — MOVE &nbsp;&nbsp; SPACE — FIRE &nbsp;&nbsp; P — PAUSE &nbsp;&nbsp; R — RESTART</div>
    <div class="controls">The invaders are now 100% certified Farage. Good luck, citizen.</div>
  </div>

<script>
// ============================================
// FARAGE INVADERS - Full Retro Clone
// ============================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: true });

// Dimensions (classic proportions scaled up)
const WIDTH = 800;
const HEIGHT = 600;

// Game constants
const PLAYER_WIDTH = 44;
const PLAYER_HEIGHT = 20;
const PLAYER_SPEED = 5.2;
const BULLET_SPEED = 9;
const BOMB_SPEED = 3.2;
const INVADER_WIDTH = 40;
const INVADER_HEIGHT = 36;
const INVADER_COLS = 11;
const INVADER_ROWS = 5;
const INVADER_H_GAP = 10;
const INVADER_V_GAP = 9;
const SHIELD_COUNT = 4;
const SHIELD_BLOCK_SIZE = 4;

// State
let gameState = 'title'; // title, playing, paused, gameover
let score = 0;
let highScore = parseInt(localStorage.getItem('farageInvadersHigh') || '0', 10);
let lives = 3;
let level = 1;
let frame = 0;

// Entities
let player = { x: WIDTH / 2 - PLAYER_WIDTH / 2, y: HEIGHT - 70, alive: true, respawnTimer: 0 };
let playerBullets = [];
let bombs = [];
let invaders = [];
let shields = [];
let particles = [];
let mysteryShip = null;

// Timing & movement
let invaderStepTime = 520;     // ms between steps (decreases)
let lastInvaderStep = 0;
let invaderDirection = 1;      // 1 right, -1 left
let invaderDropDistance = 12;
let lastBombTime = 0;
let bombInterval = 1100;
let lastMysteryTime = 0;
let mysteryInterval = 22000;

// Input
const keys = {};
let canShoot = true;

// Audio
let audioCtx;
function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) {}
}

function playTone(freq, duration, type = 'square', volume = 0.3, detune = 0) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    
    osc.type = type;
    osc.frequency.value = freq;
    if (detune) osc.detune.value = detune;
    
    filter.type = 'lowpass';
    filter.frequency.value = 1200;
    
    gain.gain.value = volume;
    
    const now = audioCtx.currentTime;
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start(now);
    
    // Envelope
    gain.gain.setValueAtTime(volume, now);
    gain.gain.linearRampToValueAtTime(0.001, now + duration);
    
    setTimeout(() => {
      osc.stop();
      osc.disconnect();
    }, duration * 1000 + 50);
  } catch (e) {}
}

const stepTones = [120, 160, 200, 240]; // classic ascending
let stepToneIndex = 0;

function playStepSound() {
  const freq = stepTones[stepToneIndex];
  playTone(freq, 0.06, 'sawtooth', 0.18);
  stepToneIndex = (stepToneIndex + 1) % stepTones.length;
}

function playShootSound() { playTone(880, 0.09, 'square', 0.22); }
function playBombSound() { playTone(140, 0.07, 'sawtooth', 0.16); }
function playHitSound() { playTone(420, 0.12, 'square', 0.25); }
function playExplosionSound() {
  playTone(80, 0.22, 'sawtooth', 0.35);
  setTimeout(() => playTone(55, 0.18, 'sawtooth', 0.22), 60);
}
function playPlayerDeath() {
  playTone(200, 0.3, 'sawtooth', 0.4);
  setTimeout(() => playTone(110, 0.4, 'sawtooth', 0.35), 90);
}
function playMysterySound() {
  for (let i = 0; i < 6; i++) {
    setTimeout(() => playTone(520 + i * 40, 0.05, 'square', 0.15), i * 70);
  }
}
function playLevelUp() {
  playTone(660, 0.1, 'square', 0.25);
  setTimeout(() => playTone(880, 0.12, 'square', 0.25), 110);
  setTimeout(() => playTone(1100, 0.18, 'square', 0.22), 230);
}

// Load invader image
const invaderImg = new Image();
invaderImg.src = 'bowling-head.jpg';

// Helper: create particles
function spawnParticles(x, y, count, colorBase = '#ffcc66') {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.5 + Math.random() * 2.8;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 0.6,
      life: 22 + Math.random() * 18,
      size: 2 + Math.random() * 2.5,
      color: colorBase
    });
  }
}

// Create invaders grid
function createInvaders() {
  invaders = [];
  const startX = 110;
  const startY = 62;
  
  for (let r = 0; r < INVADER_ROWS; r++) {
    for (let c = 0; c < INVADER_COLS; c++) {
      invaders.push({
        x: startX + c * (INVADER_WIDTH + INVADER_H_GAP),
        y: startY + r * (INVADER_HEIGHT + INVADER_V_GAP),
        row: r,
        col: c,
        alive: true,
        width: INVADER_WIDTH,
        height: INVADER_HEIGHT
      });
    }
  }
}

// Create destructible shields (4 classic bunkers)
function createShields() {
  shields = [];
  const blockSize = SHIELD_BLOCK_SIZE;
  const shieldWidthBlocks = 14;
  const shieldHeightBlocks = 8;
  const startY = HEIGHT - 160;
  const spacing = (WIDTH - 4 * (shieldWidthBlocks * blockSize)) / 5;
  
  for (let s = 0; s < SHIELD_COUNT; s++) {
    const baseX = spacing + s * (shieldWidthBlocks * blockSize + spacing);
    const blocks = [];
    
    // Classic shield shape (trapezoid-ish with solid bottom)
    for (let bx = 0; bx < shieldWidthBlocks; bx++) {
      for (let by = 0; by < shieldHeightBlocks; by++) {
        // Cut corners and create the classic "arch" shape
        const isEdge = (bx < 2 || bx > shieldWidthBlocks - 3);
        const isTop = by < 2;
        
        if (isTop && isEdge) continue; // missing top corners
        if (by === 0 && (bx < 3 || bx > shieldWidthBlocks - 4)) continue;
        
        // Small random holes for character
        if (Math.random() < 0.03) continue;
        
        blocks.push({
          x: baseX + bx * blockSize,
          y: startY + by * blockSize,
          w: blockSize,
          h: blockSize,
          alive: true
        });
      }
    }
    shields.push({ blocks });
  }
}

// Reset a level
function resetLevel(newLevel = false) {
  if (newLevel) {
    level++;
    playLevelUp();
  }
  
  player.x = WIDTH / 2 - PLAYER_WIDTH / 2;
  player.alive = true;
  player.respawnTimer = 0;
  
  playerBullets = [];
  bombs = [];
  particles = [];
  mysteryShip = null;
  
  createInvaders();
  createShields();
  
  invaderDirection = 1;
  invaderStepTime = Math.max(140, 520 - (level - 1) * 65);
  bombInterval = Math.max(520, 1100 - (level - 1) * 85);
  stepToneIndex = 0;
  
  lastInvaderStep = performance.now();
  lastBombTime = performance.now() + 600;
  lastMysteryTime = performance.now() + 12000;
}

// Full game reset
function resetGame() {
  score = 0;
  lives = 3;
  level = 1;
  resetLevel(false);
  gameState = 'playing';
}

// Find alive invaders
function getAliveInvaders() {
  return invaders.filter(i => i.alive);
}

// Check if invaders hit screen edge
function checkInvaderEdges() {
  const alive = getAliveInvaders();
  if (!alive.length) return false;
  
  let minX = Infinity, maxX = -Infinity;
  for (const inv of alive) {
    if (inv.x < minX) minX = inv.x;
    if (inv.x + inv.width > maxX) maxX = inv.x + inv.width;
  }
  
  if (invaderDirection > 0 && maxX > WIDTH - 28) return true;
  if (invaderDirection < 0 && minX < 28) return true;
  return false;
}

// Move all invaders one step
function stepInvaders() {
  const alive = getAliveInvaders();
  if (!alive.length) return;
  
  const shouldDrop = checkInvaderEdges();
  
  if (shouldDrop) {
    invaderDirection *= -1;
    for (const inv of alive) {
      inv.y += invaderDropDistance;
    }
    // Check for player contact (game over condition)
    for (const inv of alive) {
      if (inv.y + inv.height > player.y - 4) {
        endGame();
        return;
      }
    }
  } else {
    const speed = 1;
    for (const inv of alive) {
      inv.x += invaderDirection * speed;
    }
  }
  
  playStepSound();
  
  // Increase speed as fewer invaders remain (classic behavior)
  const remaining = alive.length;
  const total = INVADER_ROWS * INVADER_COLS;
  const progress = 1 - (remaining / total);
  invaderStepTime = Math.max(65, 520 - (level - 1) * 65 - progress * 280);
}

// Invaders fire bombs
function invadersShoot() {
  const now = performance.now();
  if (now - lastBombTime < bombInterval) return;
  
  const alive = getAliveInvaders();
  if (!alive.length) return;
  
  // Group by column, pick lowest in each column
  const byCol = {};
  for (const inv of alive) {
    if (!byCol[inv.col] || inv.y > byCol[inv.col].y) {
      byCol[inv.col] = inv;
    }
  }
  
  const candidates = Object.values(byCol);
  if (!candidates.length) return;
  
  // Fire from 1-2 random bottom invaders
  const numShots = Math.random() < 0.35 + level * 0.04 ? 2 : 1;
  for (let i = 0; i < numShots && candidates.length; i++) {
    const idx = Math.floor(Math.random() * candidates.length);
    const shooter = candidates.splice(idx, 1)[0];
    
    bombs.push({
      x: shooter.x + shooter.width / 2 - 2.5,
      y: shooter.y + shooter.height + 2,
      w: 5,
      h: 9,
      vy: BOMB_SPEED + (level - 1) * 0.25
    });
    playBombSound();
  }
  lastBombTime = now + (Math.random() * 180 - 90);
}

// Spawn mystery ship (UFO)
function maybeSpawnMystery() {
  const now = performance.now();
  if (mysteryShip || now - lastMysteryTime < mysteryInterval) return;
  if (Math.random() > 0.82) return;
  
  const goingRight = Math.random() > 0.5;
  mysteryShip = {
    x: goingRight ? -54 : WIDTH + 8,
    y: 44,
    w: 52,
    h: 20,
    vx: goingRight ? 2.0 : -2.0,
    points: 50 + Math.floor(Math.random() * 6) * 50 // 50-300
  };
  lastMysteryTime = now;
  playMysterySound();
}

// Update mystery
function updateMystery() {
  if (!mysteryShip) return;
  mysteryShip.x += mysteryShip.vx;
  
  if (mysteryShip.x < -70 || mysteryShip.x > WIDTH + 10) {
    mysteryShip = null;
  }
}

// Player shooting
function shoot() {
  if (!player.alive || !canShoot || playerBullets.length > 0) return;
  
  playerBullets.push({
    x: player.x + PLAYER_WIDTH / 2 - 2,
    y: player.y - 7,
    w: 4,
    h: 12,
    vy: -BULLET_SPEED
  });
  canShoot = false;
  playShootSound();
}

// Update player bullets
function updateBullets() {
  for (let i = playerBullets.length - 1; i >= 0; i--) {
    const b = playerBullets[i];
    b.y += b.vy;
    
    if (b.y < -20) {
      playerBullets.splice(i, 1);
      canShoot = true;
      continue;
    }
    
    // Hit invaders
    let hit = false;
    for (const inv of invaders) {
      if (!inv.alive) continue;
      if (b.x < inv.x + inv.width && b.x + b.w > inv.x &&
          b.y < inv.y + inv.height && b.y + b.h > inv.y) {
        
        inv.alive = false;
        playerBullets.splice(i, 1);
        canShoot = true;
        hit = true;
        
        // Score based on row (top rows worth more)
        const points = [40, 30, 25, 15, 10][inv.row] || 10;
        score += points;
        
        spawnParticles(inv.x + inv.width/2, inv.y + inv.height/2, 14, '#ffdd88');
        playHitSound();
        
        // Update high score live
        if (score > highScore) highScore = score;
        break;
      }
    }
    if (hit) continue;
    
    // Hit mystery
    if (mysteryShip &&
        b.x < mysteryShip.x + mysteryShip.w && b.x + b.w > mysteryShip.x &&
        b.y < mysteryShip.y + mysteryShip.h && b.y + b.h > mysteryShip.y) {
      
      score += mysteryShip.points;
      spawnParticles(mysteryShip.x + mysteryShip.w/2, mysteryShip.y + mysteryShip.h/2, 22, '#ffcc00');
      playerBullets.splice(i, 1);
      canShoot = true;
      playExplosionSound();
      mysteryShip = null;
      if (score > highScore) highScore = score;
      continue;
    }
    
    // Hit shields
    for (const shield of shields) {
      for (let j = shield.blocks.length - 1; j >= 0; j--) {
        const blk = shield.blocks[j];
        if (!blk.alive) continue;
        if (b.x < blk.x + blk.w && b.x + b.w > blk.x &&
            b.y < blk.y + blk.h && b.y + b.h > blk.y) {
          blk.alive = false;
          playerBullets.splice(i, 1);
          canShoot = true;
          spawnParticles(blk.x + blk.w/2, blk.y + blk.h/2, 5, '#aacc88');
          break;
        }
      }
    }
  }
}

// Update bombs
function updateBombs() {
  for (let i = bombs.length - 1; i >= 0; i--) {
    const b = bombs[i];
    b.y += b.vy;
    
    if (b.y > HEIGHT + 20) {
      bombs.splice(i, 1);
      continue;
    }
    
    // Hit player
    if (player.alive && player.respawnTimer <= 0 &&
        b.x < player.x + PLAYER_WIDTH && b.x + b.w > player.x &&
        b.y < player.y + PLAYER_HEIGHT && b.y + b.h > player.y) {
      
      bombs.splice(i, 1);
      playerHit();
      continue;
    }
    
    // Hit shields
    let destroyed = false;
    for (const shield of shields) {
      for (let j = shield.blocks.length - 1; j >= 0; j--) {
        const blk = shield.blocks[j];
        if (!blk.alive) continue;
        if (b.x < blk.x + blk.w && b.x + b.w > blk.x &&
            b.y < blk.y + blk.h && b.y + b.h > blk.y) {
          blk.alive = false;
          bombs.splice(i, 1);
          spawnParticles(blk.x + blk.w/2, blk.y + blk.h/2, 6, '#bbaa66');
          destroyed = true;
          break;
        }
      }
      if (destroyed) break;
    }
  }
}

// Player was hit
function playerHit() {
  if (!player.alive) return;
  
  lives--;
  player.alive = false;
  player.respawnTimer = 90;
  
  spawnParticles(player.x + PLAYER_WIDTH/2, player.y + PLAYER_HEIGHT/2, 28, '#ff5555');
  playPlayerDeath();
  
  // Clear bombs on death
  bombs = [];
  
  if (lives <= 0) {
    setTimeout(endGame, 650);
  } else {
    setTimeout(() => {
      if (gameState === 'playing') {
        player.alive = true;
        player.x = WIDTH / 2 - PLAYER_WIDTH / 2;
        player.respawnTimer = 45; // brief invulnerability
      }
    }, 620);
  }
}

// End game
function endGame() {
  gameState = 'gameover';
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('farageInvadersHigh', highScore);
  }
  playExplosionSound();
}

// Check win condition
function checkWin() {
  if (getAliveInvaders().length === 0) {
    // Next level
    setTimeout(() => {
      if (gameState === 'playing') {
        resetLevel(true);
      }
    }, 420);
  }
}

// Update particles
function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.12; // gravity
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// Main update
function update(now) {
  if (gameState !== 'playing') return;
  
  frame++;
  
  // Player movement
  if (player.alive && player.respawnTimer <= 0) {
    if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && player.x > 18) {
      player.x -= PLAYER_SPEED;
    }
    if ((keys['ArrowRight'] || keys['d'] || keys['D']) && player.x < WIDTH - PLAYER_WIDTH - 18) {
      player.x += PLAYER_SPEED;
    }
  }
  if (player.respawnTimer > 0) player.respawnTimer--;
  
  // Shooting
  if ((keys[' '] || keys['Spacebar']) && canShoot) {
    shoot();
  }
  
  // Invader movement
  if (now - lastInvaderStep > invaderStepTime) {
    stepInvaders();
    lastInvaderStep = now;
  }
  
  // Shooting from invaders
  invadersShoot();
  
  // Mystery ship
  maybeSpawnMystery();
  updateMystery();
  
  // Projectiles
  updateBullets();
  updateBombs();
  
  // Particles
  updateParticles();
  
  // Win check
  checkWin();
  
  // Occasional extra aggression
  if (Math.random() < 0.006 && bombs.length < 3 + level) {
    // small chance for extra bomb
  }
}

// Draw everything
function draw() {
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, WIDTH, HEIGHT);
  
  // Scanlines / retro overlay (very subtle)
  ctx.fillStyle = 'rgba(0, 255, 65, 0.025)';
  for (let y = 0; y < HEIGHT; y += 3) {
    ctx.fillRect(0, y, WIDTH, 1);
  }
  
  // === TITLE / MENU ===
  if (gameState === 'title') {
    ctx.fillStyle = '#00ff41';
    ctx.font = 'bold 42px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText('FARAGE', WIDTH/2, 172);
    ctx.fillText('INVADERS', WIDTH/2, 224);
    
    // Blinking start prompt
    if (Math.floor(frame / 22) % 2 === 0) {
      ctx.font = '14px "Press Start 2P"';
      ctx.fillStyle = '#00cc33';
      ctx.fillText('PRESS SPACE TO START', WIDTH/2, 298);
    }
    
    ctx.font = '11px "Press Start 2P"';
    ctx.fillStyle = '#777';
    ctx.fillText('THE CLASSIC 1978 GAME', WIDTH/2, 358);
    ctx.fillText('NOW FEATURING FARAGE', WIDTH/2, 378);
    
    ctx.font = '10px "Press Start 2P"';
    ctx.fillStyle = '#444';
    ctx.fillText('HIGH SCORE: ' + highScore.toString().padStart(5, '0'), WIDTH/2, 450);
    
    // Little preview heads with glow
    if (invaderImg.complete) {
      ctx.save();
      ctx.shadowColor = '#00ff41';
      ctx.shadowBlur = 14;
      ctx.drawImage(invaderImg, 268, 482, 52, 46);
      ctx.drawImage(invaderImg, 480, 482, 52, 46);
      ctx.restore();
    }
    
    // Small formation hint at very bottom
    ctx.fillStyle = '#112211';
    ctx.fillRect(310, 548, 180, 2);
    return;
  }
  
  // === HUD ===
  ctx.fillStyle = '#00ff41';
  ctx.font = 'bold 14px "Press Start 2P"';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE', 36, 28);
  ctx.fillText(score.toString().padStart(5, '0'), 36, 48);
  
  ctx.textAlign = 'right';
  ctx.fillText('HIGH', WIDTH - 36, 28);
  ctx.fillText(highScore.toString().padStart(5, '0'), WIDTH - 36, 48);
  
  ctx.textAlign = 'center';
  ctx.fillText('LEVEL ' + level, WIDTH / 2, 38);
  
  // Lives
  ctx.textAlign = 'left';
  ctx.fillText('LIVES', 36, HEIGHT - 22);
  for (let i = 0; i < lives; i++) {
    drawPlayerShip(120 + i * 32, HEIGHT - 36, 0.7);
  }
  
  // === SHIELDS ===
  ctx.fillStyle = '#44aa66';
  for (const shield of shields) {
    for (const blk of shield.blocks) {
      if (!blk.alive) continue;
      ctx.fillRect(blk.x, blk.y, blk.w, blk.h);
      // tiny highlight
      ctx.fillStyle = '#66cc88';
      ctx.fillRect(blk.x, blk.y, blk.w, 1);
      ctx.fillStyle = '#44aa66';
    }
  }
  
  // === INVADERS (THE FARAGES) ===
  const aliveInvaders = getAliveInvaders();
  const animFrame = Math.floor(frame / 9) % 2;
  
  for (const inv of invaders) {
    if (!inv.alive) continue;
    
    const bob = animFrame === 0 ? 0 : 1;
    const drawY = inv.y + bob;
    
    if (invaderImg.complete && invaderImg.naturalWidth > 0) {
      // Draw the head, cropped nicely to face
      const sx = invaderImg.width * 0.12;
      const sy = invaderImg.height * 0.03;
      const sw = invaderImg.width * 0.76;
      const sh = invaderImg.height * 0.82;
      
      // Slight row tinting for variety
      ctx.save();
      if (inv.row === 0) ctx.filter = 'saturate(1.15) brightness(1.05)';
      else if (inv.row === 1) ctx.filter = 'hue-rotate(-8deg) saturate(1.1)';
      else if (inv.row === 4) ctx.filter = 'brightness(0.92)';
      
      ctx.drawImage(
        invaderImg,
        sx, sy, sw, sh,
        inv.x + 1, drawY, inv.width - 2, inv.height - 1
      );
      ctx.restore();
      
      // Classic "legs" animation under the head (scaled for bigger 40px invaders)
      const legY = drawY + inv.height - 5;
      ctx.fillStyle = '#0a1f0a';
      if (animFrame === 0) {
        ctx.fillRect(inv.x + 7, legY, 6, 4);
        ctx.fillRect(inv.x + inv.width - 13, legY, 6, 4);
      } else {
        ctx.fillRect(inv.x + 3, legY, 5, 3);
        ctx.fillRect(inv.x + inv.width - 8, legY, 5, 3);
        ctx.fillRect(inv.x + 12, legY + 2, 4, 2);
        ctx.fillRect(inv.x + inv.width - 16, legY + 2, 4, 2);
      }
    } else {
      // Fallback rectangle if image fails
      ctx.fillStyle = '#ffaa44';
      ctx.fillRect(inv.x, drawY, inv.width, inv.height);
    }
  }
  
  // === MYSTERY SHIP ===
  if (mysteryShip) {
    ctx.fillStyle = '#ffaa00';
    ctx.fillRect(mysteryShip.x + 5, mysteryShip.y + 3, mysteryShip.w - 10, mysteryShip.h - 6);
    ctx.fillStyle = '#ffdd44';
    ctx.fillRect(mysteryShip.x + 10, mysteryShip.y + 5, 11, 4);
    ctx.fillRect(mysteryShip.x + mysteryShip.w - 21, mysteryShip.y + 5, 11, 4);
    ctx.fillStyle = '#662200';
    ctx.fillRect(mysteryShip.x + 16, mysteryShip.y + 8, 20, 4);
  }
  
  // === PLAYER ===
  if (player.alive) {
    const flash = player.respawnTimer > 0 && Math.floor(frame / 3) % 2 === 0;
    if (!flash) {
      drawPlayerShip(player.x, player.y, 1.0);
    }
  }
  
  // === BULLETS ===
  ctx.fillStyle = '#ffffff';
  for (const b of playerBullets) {
    ctx.fillRect(b.x, b.y, b.w, b.h);
  }
  
  // === BOMBS ===
  ctx.fillStyle = '#ffaa66';
  for (const b of bombs) {
    ctx.fillRect(b.x, b.y, b.w, b.h);
    // little classic bomb detail
    ctx.fillStyle = '#ffcc99';
    ctx.fillRect(b.x + 1, b.y + 2, 2, 2);
    ctx.fillStyle = '#ffaa66';
  }
  
  // === PARTICLES ===
  for (const p of particles) {
    const alpha = Math.max(0.3, p.life / 32);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  
  // === PAUSED / GAME OVER overlays ===
  if (gameState === 'paused') {
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.fillStyle = '#00ff41';
    ctx.font = 'bold 28px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', WIDTH/2, HEIGHT/2 - 10);
    ctx.font = '12px "Press Start 2P"';
    ctx.fillText('PRESS P TO RESUME', WIDTH/2, HEIGHT/2 + 28);
  }
  
  if (gameState === 'gameover') {
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    
    ctx.fillStyle = '#ff2a2a';
    ctx.font = 'bold 32px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', WIDTH/2, HEIGHT/2 - 36);
    
    ctx.fillStyle = '#00ff41';
    ctx.font = '16px "Press Start 2P"';
    ctx.fillText('FINAL SCORE', WIDTH/2, HEIGHT/2 + 4);
    ctx.fillText(score.toString().padStart(5, '0'), WIDTH/2, HEIGHT/2 + 32);
    
    ctx.font = '12px "Press Start 2P"';
    ctx.fillStyle = '#aaa';
    ctx.fillText('PRESS R TO PLAY AGAIN', WIDTH/2, HEIGHT/2 + 78);
    ctx.fillText('PRESS SPACE FOR TITLE', WIDTH/2, HEIGHT/2 + 102);
  }
}

// Classic player ship drawing
function drawPlayerShip(x, y, scale = 1) {
  const w = PLAYER_WIDTH * scale;
  const h = PLAYER_HEIGHT * scale;
  const cx = x + w / 2;
  
  ctx.fillStyle = '#00ff41';
  
  // Main body
  ctx.fillRect(x + 4*scale, y + 6*scale, w - 8*scale, h - 6*scale);
  
  // Top "cabin"
  ctx.fillRect(cx - 7*scale, y + 2*scale, 14*scale, 6*scale);
  
  // Side guns / wings
  ctx.fillRect(x, y + 12*scale, 6*scale, 5*scale);
  ctx.fillRect(x + w - 6*scale, y + 12*scale, 6*scale, 5*scale);
  
  // Bottom detail
  ctx.fillStyle = '#003311';
  ctx.fillRect(x + 10*scale, y + 14*scale, w - 20*scale, 4*scale);
  
  // Cockpit highlight
  ctx.fillStyle = '#aaffcc';
  ctx.fillRect(cx - 3*scale, y + 4*scale, 6*scale, 3*scale);
}

// Game loop
let lastTime = 0;
function gameLoop(ts = 0) {
  const now = ts || performance.now();
  
  update(now);
  draw();
  
  // Auto-save high score
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('farageInvadersHigh', highScore);
  }
  
  requestAnimationFrame(gameLoop);
}

// Input handlers
window.addEventListener('keydown', (e) => {
  keys[e.key] = true;
  
  if (e.key === ' ' || e.key === 'Spacebar') {
    e.preventDefault();
    if (gameState === 'title') {
      initAudio();
      resetGame();
    } else if (gameState === 'playing') {
      shoot();
    } else if (gameState === 'gameover') {
      initAudio();
      resetGame();
    }
  }
  
  if (e.key.toLowerCase() === 'p') {
    e.preventDefault();
    if (gameState === 'playing') {
      gameState = 'paused';
    } else if (gameState === 'paused') {
      gameState = 'playing';
      lastInvaderStep = performance.now();
    }
  }
  
  if ((e.key.toLowerCase() === 'r') && (gameState === 'gameover' || gameState === 'playing')) {
    e.preventDefault();
    initAudio();
    resetGame();
  }
  
  if (e.key === 'Escape' && gameState === 'playing') {
    gameState = 'paused';
  }
});

window.addEventListener('keyup', (e) => {
  keys[e.key] = false;
  if (e.key === ' ' || e.key === 'Spacebar') {
    canShoot = true;
  }
});

// Touch support (simple)
let touchStartX = 0;
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  initAudio();
  if (gameState === 'title') {
    resetGame();
    return;
  }
  if (gameState === 'gameover') {
    resetGame();
    return;
  }
  if (gameState === 'paused') {
    gameState = 'playing';
    return;
  }
  touchStartX = e.touches[0].clientX;
  // Tap to shoot
  if (gameState === 'playing') shoot();
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (gameState !== 'playing' || !player.alive) return;
  const touchX = e.touches[0].clientX;
  const rect = canvas.getBoundingClientRect();
  const relativeX = touchX - rect.left;
  player.x = Math.max(18, Math.min(WIDTH - PLAYER_WIDTH - 18, relativeX - PLAYER_WIDTH / 2));
}, { passive: false });

// Click on canvas also shoots (desktop)
canvas.addEventListener('mousedown', (e) => {
  if (gameState === 'title') {
    initAudio();
    resetGame();
  } else if (gameState === 'playing' && player.alive) {
    shoot();
  } else if (gameState === 'gameover') {
    resetGame();
  }
});

// Boot
function boot() {
  // Make sure image is loaded before first draws (it will lazy draw)
  invaderImg.onload = () => {
    // Image ready
  };
  
  // Initial invaders for the title screen preview (they won't move)
  createInvaders();
  createShields();
  
  // Show a few bombs on title for flavor (static)
  // (we just draw in title state)
  
  // Start loop
  requestAnimationFrame(gameLoop);
  
  // Friendly console note
  console.log('%c[Farage Invaders] Ready. Use arrow keys / space. Good luck!', 'color:#00ff41');
}

// Kick off
boot();
</script>
